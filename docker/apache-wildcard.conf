# Apache config: tenant routing qua subdomain wildcard
# - quanlybanhang.localhost  → /var/www/html/landing/
# - admin.quanlybanhang.localhost → /var/www/html/admin-panel/
# - <tenant>.localhost  → /var/www/html/tenants/<tenant>/  (fallback /var/www/html)

<VirtualHost *:80>
    ServerName quanlybanhang.localhost
    ServerAlias localhost
    DocumentRoot /var/www/html/landing
    <Directory /var/www/html/landing>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
    ErrorLog ${APACHE_LOG_DIR}/landing.error.log
</VirtualHost>

<VirtualHost *:80>
    ServerName admin.quanlybanhang.localhost
    DocumentRoot /var/www/html/admin-panel
    <Directory /var/www/html/admin-panel>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
    ErrorLog ${APACHE_LOG_DIR}/admin.error.log
</VirtualHost>

# Wildcard: bất kỳ subdomain *.localhost → mapping qua mod_rewrite
<VirtualHost *:80>
    ServerName tenant.localhost
    ServerAlias *.localhost
    UseCanonicalName Off
    VirtualDocumentRoot /var/www/html/tenants/%1
    <Directory /var/www/html/tenants>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
    ErrorLog ${APACHE_LOG_DIR}/tenant.error.log
</VirtualHost>

# Default (localhost root) - giữ behavior cũ
<VirtualHost *:80>
    ServerName default
    DocumentRoot /var/www/html
    <Directory /var/www/html>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>
