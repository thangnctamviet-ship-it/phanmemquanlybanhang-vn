version: "3.9"

# ============================================================
# Phần mềm quản lý bán hàng - Môi trường test với Docker
# Chạy: docker compose up -d
# Truy cập: http://localhost:8080
# phpMyAdmin: http://localhost:8081  (user: root / pass: root)
# ============================================================

services:
  web:
    image: php:8.2-apache
    container_name: pmqlbh_web
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./docker/apache.conf:/etc/apache2/sites-available/000-default.conf
    depends_on:
      - db
    command: >
      bash -c "
      docker-php-ext-install mysqli pdo pdo_mysql &&
      a2enmod rewrite &&
      apache2-foreground
      "
    environment:
      - APACHE_DOCUMENT_ROOT=/var/www/html

  db:
    image: mysql:8.0
    container_name: pmqlbh_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: stock
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./stock.sql:/docker-entrypoint-initdb.d/stock.sql:ro
    command: --default-authentication-plugin=mysql_native_password

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: pmqlbh_pma
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: root
    depends_on:
      - db

volumes:
  db_data:
